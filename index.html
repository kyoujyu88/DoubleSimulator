<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まんじゅう倍々シミュレーター</title>
<style>
  :root {
    --panel-bg: rgba(20, 16, 12, 0.78);
    --accent: #ffb347;
    --danger: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1410; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; color: #f5ead8; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel {
    position: fixed; backdrop-filter: blur(8px);
    background: var(--panel-bg); border: 1px solid rgba(255, 179, 71, 0.25);
    border-radius: 14px; padding: 14px 18px;
  }
  #hud {
    top: 16px; left: 16px; min-width: 290px; max-width: 92vw;
  }
  #hud h1 { font-size: 17px; letter-spacing: 2px; color: var(--accent); margin-bottom: 8px; }
  #hud h1 small { font-size: 11px; color: #cbb89a; letter-spacing: 0; margin-left: 6px; }
  #count {
    font-size: 30px; font-weight: 700; line-height: 1.2; color: #fff;
    word-break: break-all; text-shadow: 0 0 16px rgba(255, 179, 71, .45);
  }
  #count .unit { font-size: 18px; color: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; margin-top: 6px; color: #e8d9bd; }
  .row b { color: #fff; font-weight: 600; text-align: right; }
  #compare { margin-top: 8px; font-size: 13px; color: var(--accent); min-height: 1.4em; }
  #mode { margin-top: 4px; font-size: 11px; color: #8fd18f; }
  #progressWrap { margin-top: 10px; height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  #progress { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb347, #ff6b6b); transition: width .1s linear; }
  #nextLabel { font-size: 11px; color: #b8a888; margin-top: 4px; }

  #controls {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(255, 179, 71, .4); border-radius: 10px;
    background: rgba(255, 179, 71, .15); color: #ffe2b8; padding: 9px 16px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 179, 71, .3); }
  button:active { transform: scale(.96); }
  button.danger { border-color: rgba(255, 107, 107, .5); background: rgba(255, 107, 107, .15); color: #ffc9c9; }
  button.danger:hover { background: rgba(255, 107, 107, .3); }
  #controls label { font-size: 12px; color: #cbb89a; display: flex; align-items: center; gap: 6px; }
  input[type="range"] { accent-color: var(--accent); width: 110px; }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
    z-index: 10;
  }
  .toastMsg {
    background: rgba(20, 16, 12, .85); border: 1px solid rgba(255, 179, 71, .4);
    color: #ffe2b8; font-size: 14px; padding: 8px 18px; border-radius: 20px;
    animation: toastIn .4s ease, toastOut .6s ease 3.4s forwards;
    white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-12px); } }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1a1410; z-index: 100; flex-direction: column; gap: 12px;
    font-size: 15px; color: var(--accent); letter-spacing: 1px;
  }
  #loading .manju { font-size: 48px; animation: bounce 1s ease infinite; }
  @keyframes bounce { 50% { transform: translateY(-14px) scale(1.05, .95); } }

  #footer {
    position: fixed; bottom: 8px; right: 12px; font-size: 10.5px; color: rgba(255,255,255,.35);
  }
  @media (max-width: 600px) {
    #hud { min-width: 0; right: 16px; }
    #count { font-size: 22px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="manju">🌰</div>物理エンジンを読み込み中…</div>

<div id="hud" class="panel">
  <h1>🌰 まんじゅう倍々シミュレーター<small>5分ごとに2倍</small></h1>
  <div id="count">1 <span class="unit">個</span></div>
  <div class="row"><span>倍増回数</span><b id="gen">0 回</b></div>
  <div class="row"><span>経過時間（1回=5分 換算）</span><b id="storyTime">0 分</b></div>
  <div class="row"><span>総体積</span><b id="volume">80 cm³</b></div>
  <div class="row"><span>総質量</span><b id="mass">50 g</b></div>
  <div class="row"><span>剛体 / FPS</span><b id="perf">1個 / -</b></div>
  <div id="compare"></div>
  <div id="mode">⚙️ 物理演算モード（Rapier）</div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="nextLabel">次の倍増まで…</div>
</div>

<div id="controls" class="panel">
  <button id="playBtn">⏸ 一時停止</button>
  <label>倍増間隔 <input type="range" id="speed" min="0.5" max="10" step="0.5" value="4"><span id="speedVal">4秒</span></label>
  <button id="resetBtn">↺ リセット</button>
  <button id="rocketBtn" class="danger">🚀 宇宙へ捨てる</button>
</div>

<div id="toast"></div>
<div id="footer">ドラッグで回転 / ホイールでズーム / 物理: Rapier</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import RAPIER from '@dimforge/rapier3d-compat';

// ---------- 定数 ----------
const MANJU_RADIUS = 0.5;          // 表示上のまんじゅう半径
const MANJU_VOLUME_M3 = 80e-6;     // 栗まんじゅう1個 ≈ 80 cm³
const MANJU_MASS_KG = 0.05;        // 1個 ≈ 50 g
// 物理剛体の上限。?phys=8192 のようにURLで変更可（重い端末は512など）
const MAX_PHYS = Math.min(8192, Math.max(128,
  Number(new URLSearchParams(location.search).get('phys')) || 4096));
// これだけ静止し続けた剛体は固定ボディ化（石化）してソルバーから外す
const PETRIFY_MS = 3000;

// 体積の比較対象（m³, 小さい順）
const COMPARISONS = [
  [3e-4,     'お茶碗'],
  [8e-3,     'バケツ'],
  [0.2,      'お風呂'],
  [40,       'ワンルームの部屋'],
  [180,      '学校の教室'],
  [540,      '25mプール'],
  [1.24e6,   '東京ドーム'],
  [4e11,     '富士山'],
  [1.4e18,   '月'],
  [1.08e21,  '地球'],
  [1.41e27,  '太陽'],
];

// 個数到達マイルストーン → メッセージ（体積換算でだいたい合わせてある）
const MILESTONES = [
  [4n,        'まだ余裕。おいしくいただけます 😋'],
  [64n,       'そろそろ食べきれない量です…'],
  [1n << 12n, 'お風呂いっぱいのまんじゅう！'],
  [1n << 19n, '部屋がまんじゅうで埋まりました！'],
  [1n << 24n, '学校の体育館も満杯になりました…'],
  [1n << 34n, '東京ドームが満杯になりました'],
  [1n << 53n, '富士山サイズのまんじゅう山が出現'],
  [1n << 84n, '⚠️ 地球がまんじゅうで埋め尽くされました！'],
  [1n << 104n, '太陽よりも大きい…。もうロケットで捨てるしかない！🚀'],
];

// 漢数字の大数単位（4桁ごと）
const KANJI_UNITS = ['', '万', '億', '兆', '京', '垓', '𥝱', '穣', '溝', '澗',
                     '正', '載', '極', '恒河沙', '阿僧祇', '那由他', '不可思議', '無量大数'];

// ---------- 物理エンジン初期化 ----------
await RAPIER.init();
document.getElementById('loading').remove();

const GRAVITY = { x: 0, y: -19.6, z: 0 }; // 少し強めの重力でキビキビ動かす
let world;
function createWorld() {
  world = new RAPIER.World(GRAVITY);
  // 床
  world.createCollider(
    RAPIER.ColliderDesc.cuboid(600, 0.5, 600).setTranslation(0, -0.5, 0).setFriction(0.9)
  );
}
createWorld();

// ---------- シーン ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);
scene.fog = new THREE.FogExp2(0x1a1410, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(7, 5, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xfff2dd, 0x42301f, 0.9));
const sun = new THREE.DirectionalLight(0xffe0b0, 1.6);
sun.position.set(6, 12, 4);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8899ff, 0.5);
rim.position.set(-8, 4, -6);
scene.add(rim);

// 星空（宇宙感の演出・遠景）
{
  const starGeo = new THREE.BufferGeometry();
  const N = 1500, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(1800 + Math.random() * 1200);
    pos.set([v.x, Math.abs(v.y), v.z], i * 3);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff5e0, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.7 })));
}

// 地面
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(2000, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 1 })
);
scene.add(ground);

// 接地影（山の下の薄い影）
const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1, 48).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false })
);
contactShadow.position.y = 0.01;
scene.add(contactShadow);

// ---------- 宇宙モード（増え続けるまんじゅうの行き着く先） ----------
const SPACE_VOL = 1e12;          // 体積がこれ以上（半径6km超）になったら惑星ビューへ
const STAR_MASS = 1.6e29;        // 恒星の点火限界 ≈ 0.08太陽質量 [kg]
const SUN_MASS = 1.989e30;
const BH_COEF = 9.28e-25;        // シュバルツシルト半径[m] = BH_COEF × 体積[m³]（密度625kg/m³）

// 比較天体（半径の小さい順）。まんじゅう球の1/100未満になったら「卒業」して次へ
const CELESTIAL_REFS = [
  { r: 1.1e4,   name: 'フォボス（火星の衛星）', color: 0x8a7f72 },
  { r: 4.7e5,   name: '準惑星ケレス',           color: 0x9a8d7d },
  { r: 1.737e6, name: '月',                     color: 0xc8c4bb },
  { r: 6.371e6, name: '地球',                   color: 0x4a7fbf },
  { r: 7.0e7,   name: '木星',                   color: 0xc9a06b },
  { r: 6.96e8,  name: '太陽',                   color: 0xffcc55, glow: true },
  { r: 1.19e9,  name: 'シリウスA',              color: 0xcfe0ff, glow: true },
  { r: 1.8e10,  name: 'アークトゥルス',         color: 0xffaa66, glow: true },
  { r: 6.2e11,  name: 'ベテルギウス',           color: 0xff6644, glow: true },
];

function makeManjuPlanetTexture() { // 無数のまんじゅうでできた惑星の表面
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#caa05f';
  ctx.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 5000; i++) {
    const x = Math.random() * 1024, y = Math.random() * 1024;
    const r = 5 + Math.random() * 10;
    const g = ctx.createRadialGradient(x, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, '#a96a28');
    g.addColorStop(0.7, '#c08a44');
    g.addColorStop(1, '#caa05f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,200,120,0.9)');
  g.addColorStop(0.4, 'rgba(255,150,60,0.35)');
  g.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function makeLabel() { // 天体の上に出す2行テキスト
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 220;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(11, 11 * 220 / 1024, 1);
  return {
    sprite,
    set(line1, line2) {
      ctx.clearRect(0, 0, 1024, 1024);
      ctx.textAlign = 'center';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.fillStyle = '#ffe2b8';
      ctx.font = 'bold 64px sans-serif';
      ctx.strokeText(line1, 512, 80);
      ctx.fillText(line1, 512, 80);
      ctx.fillStyle = '#ffffff';
      ctx.font = '52px sans-serif';
      ctx.strokeText(line2, 512, 170);
      ctx.fillText(line2, 512, 170);
      tex.needsUpdate = true;
    },
  };
}

function formatDist(m) {
  if (!Number.isFinite(m)) return '∞';
  const LY = 9.46e15;
  if (m >= LY * 0.1) return `${trimNum(m / LY)} 光年`;
  if (m >= 1e12) return `${trimNum(m / 1e12)} 億km`;
  if (m >= 1e8) return `${trimNum(m / 1e7)} 万km`;
  return `${Math.round(m / 1000).toLocaleString('ja-JP')} km`;
}

const space = {
  active: false, stage: '', refIdx: -2, lastGen: -1,
  group: null, manjuBall: null, refBall: null, glow: null, disk: null,
  manjuLabel: null, refLabel: null,
};

function buildSpace() {
  if (space.group) return;
  space.group = new THREE.Group();
  space.group.visible = false;
  scene.add(space.group);

  space.manjuBall = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({ map: makeManjuPlanetTexture(), roughness: 0.8 })
  );
  space.group.add(space.manjuBall);

  space.refBall = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({ roughness: 0.7 })
  );
  space.group.add(space.refBall);

  const glowTex = makeGlowTexture();
  space.glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  }));
  space.glow.visible = false;
  space.group.add(space.glow);

  space.refGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  }));
  space.refGlow.visible = false;
  space.group.add(space.refGlow);

  // ブラックホールの降着円盤（まんじゅう色に輝く）
  const diskTex = (() => {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 256, 0);
    g.addColorStop(0, 'rgba(255,230,170,1)');
    g.addColorStop(0.5, 'rgba(255,150,60,0.7)');
    g.addColorStop(1, 'rgba(180,80,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 64);
    return new THREE.CanvasTexture(c);
  })();
  const diskGeo = new THREE.RingGeometry(1.25, 3.2, 64);
  // リング半径方向にグラデーションを乗せるためUVを書き換える
  {
    const pos = diskGeo.attributes.position, uv = diskGeo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const d = Math.hypot(pos.getX(i), pos.getY(i));
      uv.setXY(i, (d - 1.25) / (3.2 - 1.25), 0.5);
    }
  }
  space.disk = new THREE.Mesh(diskGeo, new THREE.MeshBasicMaterial({
    map: diskTex, blending: THREE.AdditiveBlending, transparent: true,
    side: THREE.DoubleSide, depthWrite: false,
  }));
  space.disk.rotation.x = Math.PI * 0.42;
  space.disk.visible = false;
  space.group.add(space.disk);

  space.manjuLabel = makeLabel();
  space.group.add(space.manjuLabel.sprite);
  space.refLabel = makeLabel();
  space.group.add(space.refLabel.sprite);
}

function enterSpace() {
  buildSpace();
  space.active = true;
  space.stage = '';
  space.refIdx = -2;
  space.lastGen = -1;
  space.group.visible = true;
  pile.visible = false;
  ground.visible = false;
  contactShadow.visible = false;
  controls.maxPolarAngle = Math.PI;
  showToast('🪐 もはや天体サイズ。宇宙から眺めましょう');
}

function exitSpace() {
  if (!space.active) return;
  space.active = false;
  space.stage = '';
  if (space.group) space.group.visible = false;
  pile.visible = true;
  ground.visible = true;
  contactShadow.visible = true;
  controls.maxPolarAngle = Math.PI * 0.49;
}

function applySpaceStage(stage) {
  space.stage = stage;
  const m = space.manjuBall.material;
  if (stage === 'planet') {
    m.color.set(0xffffff); m.emissive.set(0x000000); m.emissiveMap = null;
    m.needsUpdate = true;
    space.glow.visible = false;
    space.disk.visible = false;
    $('mode').textContent = '🪐 まんじゅう惑星モード';
  } else if (stage === 'star') {
    m.emissive.set(0xff9933);
    m.emissiveIntensity = 0.9;
    m.emissiveMap = m.map;
    m.needsUpdate = true;
    space.glow.visible = true;
    space.disk.visible = false;
    $('mode').textContent = '☀️ まんじゅう恒星モード';
    showToast('☀️ 質量が恒星の点火限界を突破！まんじゅうが輝き始めました');
  } else if (stage === 'blackhole') {
    m.color.set(0x000000); m.emissive.set(0x000000); m.emissiveMap = null;
    m.needsUpdate = true;
    space.glow.visible = true;
    space.disk.visible = true;
    $('mode').textContent = '🕳 まんじゅうブラックホール';
    showToast('🕳 自らの重力で崩壊…まんじゅうはブラックホールになりました');
  }
}

function updateSpace(vol, mass) {
  // ステージ判定：惑星 → 恒星（点火限界） → ブラックホール（シュバルツシルト半径 > 実半径）
  const bodyR = Math.cbrt(vol * 3 / (4 * Math.PI));
  const schwR = BH_COEF * vol;
  const stage = (!Number.isFinite(vol) || schwR >= bodyR) ? 'blackhole'
    : mass >= STAR_MASS ? 'star' : 'planet';
  if (stage !== space.stage) applySpaceStage(stage);
  const R = stage === 'blackhole' ? schwR : bodyR;

  // 比較天体：まんじゅう球の1/100未満になったら次へ。全て卒業したら単独表示
  let refIdx = CELESTIAL_REFS.findIndex(ref => ref.r > R / 100);
  if (!Number.isFinite(R)) refIdx = -1;
  const ref = refIdx >= 0 ? CELESTIAL_REFS[refIdx] : null;

  // 表示サイズ：大きい方を8ユニットに正規化して並べる
  const maxR = ref ? Math.max(R, ref.r) : R;
  const DM = Math.max(0.12, 8 * (Number.isFinite(R) ? R / maxR : 1));
  const DR = ref ? Math.max(0.12, 8 * ref.r / maxR) : 0;
  const gap = 2.5;
  // まんじゅう球を左、比較天体を右に（全体の中心を原点へ）
  const total = ref ? DM * 2 + gap + DR * 2 : DM * 2;
  const manjuX = ref ? -(total / 2) + DM : 0;
  const refX = ref ? total / 2 - DR : 0;

  space.manjuBall.scale.setScalar(DM);
  space.manjuBall.position.set(manjuX, 0, 0);
  space.manjuBall.rotation.y += 0.0015;
  space.glow.scale.setScalar(DM * (space.stage === 'blackhole' ? 3.2 : 4));
  space.glow.position.copy(space.manjuBall.position);
  space.disk.scale.setScalar(DM);
  space.disk.position.copy(space.manjuBall.position);
  space.disk.rotation.z += 0.002;
  space.manjuLabel.sprite.position.set(manjuX, DM + 2.2, 0);

  if (ref) {
    space.refBall.visible = true;
    space.refBall.scale.setScalar(DR);
    space.refBall.position.set(refX, 0, 0);
    space.refBall.material.color.set(ref.color);
    space.refBall.material.emissive.set(ref.glow ? ref.color : 0x000000);
    space.refBall.material.emissiveIntensity = 0.7;
    space.refGlow.visible = !!ref.glow;
    space.refGlow.scale.setScalar(DR * 4);
    space.refGlow.position.copy(space.refBall.position);
    space.refLabel.sprite.visible = true;
    space.refLabel.sprite.position.set(refX, DR + 2.2, 0);
  } else {
    space.refBall.visible = false;
    space.refGlow.visible = false;
    space.refLabel.sprite.visible = false;
  }

  // ラベルは倍増・天体切替のときだけ描き直す
  if (space.lastGen !== state.gen || refIdx !== space.refIdx) {
    space.lastGen = state.gen;
    if (refIdx !== space.refIdx && space.refIdx >= 0 && refIdx > space.refIdx) {
      showToast(`${CELESTIAL_REFS[space.refIdx].name}を超えました！`);
    }
    space.refIdx = refIdx;
    const title = stage === 'blackhole' ? 'まんじゅうブラックホール'
      : stage === 'star' ? 'まんじゅう恒星' : 'まんじゅう惑星';
    const sub = stage === 'blackhole'
      ? `半径 ${formatDist(R)}・太陽の${formatSI(mass / SUN_MASS, '')}倍の質量`
      : `半径 ${formatDist(R)}`;
    space.manjuLabel.set(title, sub);
    if (ref) space.refLabel.set(ref.name, `半径 ${formatDist(ref.r)}`);
  }
  // カメラ用の表示半径（ブラックホールは降着円盤まで画角に収める）
  const camRadius = stage === 'blackhole' ? Math.max(DM * 3.4, DM + DR + gap) : DM + DR + gap;

  // ラベルはカメラ距離に合わせて拡大し、ブラックホールでは円盤の上に逃がす
  const L = Math.max(10, camRadius * 0.75);
  for (const lbl of [space.manjuLabel, space.refLabel]) {
    lbl.sprite.scale.set(L, L * 220 / 1024, 1);
  }
  space.manjuLabel.sprite.position.y = DM + 2.2 + (stage === 'blackhole' ? DM * 1.6 : 0);

  return camRadius;
}

// ---------- 栗まんじゅうジオメトリ（上が焼き色・下が生地色の頂点カラー） ----------
function buildManjuGeometry(wSeg, hSeg) {
  const geo = new THREE.SphereGeometry(MANJU_RADIUS, wSeg, hSeg);
  geo.scale(1, 0.62, 1);
  const posAttr = geo.attributes.position;
  const colors = new Float32Array(posAttr.count * 3);
  const top = new THREE.Color(0x9c5a1e);    // 焼き色（栗色）
  const bottom = new THREE.Color(0xf3dCa8); // 生地色
  const c = new THREE.Color();
  for (let i = 0; i < posAttr.count; i++) {
    const t = THREE.MathUtils.clamp(posAttr.getY(i) / (MANJU_RADIUS * 0.62) * 0.5 + 0.5, 0, 1);
    c.lerpColors(bottom, top, Math.pow(t, 1.6));
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}

// 個数に応じて描画ポリゴン数を落とす（物理コライダーは解析形状なので影響なし）
const GEO_LODS = [
  { upTo: 512,      geo: buildManjuGeometry(24, 18) },
  { upTo: 2048,     geo: buildManjuGeometry(14, 10) },
  { upTo: Infinity, geo: buildManjuGeometry(8, 6) },
];
let lodIdx = 0;
function applyLOD() {
  let idx = 0;
  while (bodies.length > GEO_LODS[idx].upTo) idx++;
  if (idx !== lodIdx) {
    lodIdx = idx;
    manjuMesh.geometry = GEO_LODS[idx].geo;
  }
}

const manjuMesh = new THREE.InstancedMesh(
  GEO_LODS[0].geo,
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.65, metalness: 0.02 }),
  MAX_PHYS
);
manjuMesh.count = 0;
manjuMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const pile = new THREE.Group();
pile.add(manjuMesh);
scene.add(pile);

// ---------- 物理ボディ管理 ----------
// まんじゅう ≈ 押しつぶした円盤＋丸い縁（roundCylinder）。見た目よりわずかに小さくして
// 接触時に柔らかく重なって見えるようにする
const COLLIDER = { halfHeight: 0.10, radius: 0.30, border: 0.16 };
const bodies = [];      // RAPIER.RigidBody（描画インデックスと1対1）
const spawnTimes = [];  // 出現アニメーション用タイムスタンプ
const sleepSince = [];  // 静止し始めた時刻（0=動いている）
const petrified = [];   // 石化（固定ボディ化）済みフラグ
const matrixClean = []; // 描画行列が最新で書き直し不要
let petrifiedCount = 0;
let staticMaxR2 = 1, staticMaxY = 0; // 静止済みボディが占める範囲（毎フレーム再計算しない）

function spawnManju(x, y, z, vel) {
  const desc = RAPIER.RigidBodyDesc.dynamic()
    .setTranslation(x, y, z)
    .setRotation(randomQuat())
    .setLinearDamping(0.25)
    .setAngularDamping(0.7);
  if (vel) desc.setLinvel(vel.x, vel.y, vel.z);
  const body = world.createRigidBody(desc);
  world.createCollider(
    RAPIER.ColliderDesc.roundCylinder(COLLIDER.halfHeight, COLLIDER.radius, COLLIDER.border)
      .setFriction(0.85)
      .setRestitution(0.12)
      .setDensity(1.0),
    body
  );
  bodies.push(body);
  spawnTimes.push(performance.now());
  sleepSince.push(0);
  petrified.push(false);
  matrixClean.push(false);
  manjuMesh.count = bodies.length;
}

const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
function randomQuat() {
  _e.set((Math.random() - 0.5) * 0.6, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.6);
  _q.setFromEuler(_e);
  return { x: _q.x, y: _q.y, z: _q.z, w: _q.w };
}

// 倍増：既存のまんじゅう1個ずつの真上に分身を生む（上限まで）
function doublePhysical() {
  const n = bodies.length;
  for (let k = 0; k < n; k++) {
    if (bodies.length >= MAX_PHYS) break;
    const p = bodies[k].translation();
    const a = Math.random() * Math.PI * 2;
    const r = 0.15 + Math.random() * 0.2;
    spawnManju(
      p.x + Math.cos(a) * r,
      p.y + 0.65 + Math.random() * 0.25,
      p.z + Math.sin(a) * r,
      { x: Math.cos(a) * 0.5, y: 0.5 + Math.random(), z: Math.sin(a) * 0.5 }
    );
    if (!petrified[k]) bodies[k].wakeUp();
  }
  applyLOD();
}

// 物理上限を超えたら全ボディを固定して「山ごと拡大」モードへ
let frozen = false;
function freezeAll() {
  frozen = true;
  for (let i = 0; i < bodies.length; i++) {
    if (!petrified[i]) {
      bodies[i].setBodyType(RAPIER.RigidBodyType.Fixed, false);
      petrified[i] = true;
      petrifiedCount++;
    }
  }
  $('mode').textContent = `🗻 拡大表示モード（物理 ${MAX_PHYS.toLocaleString()}個 + 山ごとスケール）`;
  showToast(`物理演算は${MAX_PHYS.toLocaleString()}個まで！ここからは山ごと拡大します`);
}

// ---------- 状態 ----------
const state = {
  count: 1n,            // 現在の個数（正確に保持）
  gen: 0,               // 倍増回数
  running: true,
  interval: 4,          // 倍増間隔（秒）
  timer: 0,
  milestoneIdx: 0,
  rocketing: false,
  rocketTimer: 0,
};

function doubleNow() {
  state.count *= 2n;
  state.gen += 1;
  if (!frozen) {
    doublePhysical();
    if (state.count > BigInt(MAX_PHYS)) freezeAll();
  }
  checkMilestones();
  updateHUD();
}

function resetSim(toast) {
  world.free();
  createWorld();
  bodies.length = 0;
  spawnTimes.length = 0;
  sleepSince.length = 0;
  petrified.length = 0;
  matrixClean.length = 0;
  petrifiedCount = 0;
  staticMaxR2 = 1;
  staticMaxY = 0;
  frozen = false;
  state.count = 1n;
  state.gen = 0;
  state.timer = 0;
  state.milestoneIdx = 0;
  state.rocketing = false;
  state.rocketTimer = 0;
  pile.scale.setScalar(1);
  pile.position.y = 0;
  pile.rotation.y = 0;
  exitSpace();
  spawnManju(0, MANJU_RADIUS, 0);
  applyLOD();
  $('mode').textContent = '⚙️ 物理演算モード（Rapier）';
  if (toast) showToast(toast);
  updateHUD();
}

// ---------- 表示まわり ----------
const $ = id => document.getElementById(id);

function formatCountKanji(n) { // BigInt → 「1234万5678」のような表記
  const s = n.toString();
  if (s.length > KANJI_UNITS.length * 4) { // 無量大数(10^68)超は指数表記
    return `${s[0]}.${s.slice(1, 3)}×10<span style="font-size:.6em;vertical-align:super">${s.length - 1}</span>`;
  }
  let out = '', rest = s;
  let unit = 0;
  const groups = [];
  while (rest.length > 0) {
    groups.unshift([rest.slice(-4), KANJI_UNITS[unit++]]);
    rest = rest.slice(0, -4);
  }
  const shown = groups.slice(0, 3); // 上位3単位だけ表示して読みやすく
  for (const [digits, u] of shown) {
    const d = String(Number(digits));
    if (d !== '0') out += d + (u ? `<span class="unit">${u}</span>` : '');
  }
  return out || '0';
}

const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c => SUP[+c] ?? c).join('');
const trimNum = x => Number(x.toPrecision(3)).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
function formatSI(x, unit) {
  if (!Number.isFinite(x)) return `∞ ${unit}`;
  if (x >= 1e16) {
    const e = Math.floor(Math.log10(x));
    return `${(x / 10 ** e).toFixed(2)}×10${sup(e)} ${unit}`;
  }
  const units = [[1e12, '兆'], [1e8, '億'], [1e4, '万']];
  for (const [v, label] of units) {
    if (x >= v) return `${trimNum(x / v)}${label} ${unit}`;
  }
  return `${trimNum(x)} ${unit}`;
}

function bigToNumber(n) { // 桁あふれしない近似変換
  const s = n.toString();
  return s.length > 15 ? Number(s.slice(0, 15)) * Math.pow(10, s.length - 15) : Number(s);
}

function formatStoryTime(gen) {
  const min = gen * 5;
  if (min < 60) return `${min} 分`;
  if (min < 1440) return `${Math.floor(min / 60)} 時間 ${min % 60} 分`;
  return `${Math.floor(min / 1440)} 日 ${Math.floor((min % 1440) / 60)} 時間`;
}

function updateHUD() {
  const countNum = bigToNumber(state.count);
  $('count').innerHTML = `${formatCountKanji(state.count)} <span class="unit">個</span>`;
  $('gen').textContent = `${state.gen} 回`;
  $('storyTime').textContent = formatStoryTime(state.gen);

  const vol = countNum * MANJU_VOLUME_M3;
  const mass = countNum * MANJU_MASS_KG;
  $('volume').textContent = vol < 1
    ? `${(vol * 1e6).toLocaleString('ja-JP', { maximumFractionDigits: 0 })} cm³`
    : `${formatSI(vol, 'm³')}`;
  $('mass').textContent = mass < 1 ? `${trimNum(mass * 1000)} g`
    : mass < 1000 ? `${trimNum(mass)} kg`
    : formatSI(mass / 1000, 't');

  // 比較表示：超えている最大の対象
  let cmp = '';
  for (const [v, name] of COMPARISONS) {
    if (vol >= v) cmp = `${name} 約${formatSI(vol / v, '')}個分の体積！`;
  }
  $('compare').textContent = cmp;
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toastMsg';
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function checkMilestones() {
  while (state.milestoneIdx < MILESTONES.length && state.count >= MILESTONES[state.milestoneIdx][0]) {
    showToast(MILESTONES[state.milestoneIdx][1]);
    state.milestoneIdx++;
  }
}

// ---------- UI イベント ----------
$('playBtn').addEventListener('click', () => {
  state.running = !state.running;
  $('playBtn').textContent = state.running ? '⏸ 一時停止' : '▶ 再開';
});
$('speed').addEventListener('input', e => {
  state.interval = Number(e.target.value);
  $('speedVal').textContent = `${state.interval}秒`;
});
$('resetBtn').addEventListener('click', () => resetSim('リセットしました'));
$('rocketBtn').addEventListener('click', () => {
  if (state.rocketing) return;
  if (space.active) {
    showToast('もう手遅れです。宇宙のどこにも捨て場所がありません…');
    return;
  }
  state.rocketing = true;
  state.rocketTimer = 0;
  state.running = false;
  $('playBtn').textContent = '▶ 再開';
  showToast('🚀 まんじゅうを宇宙へ……');
  if (!frozen) {
    // 石化済みのまんじゅうを動的に戻してから、全部に打ち上げの力を与える
    for (let i = 0; i < bodies.length; i++) {
      if (petrified[i]) {
        bodies[i].setBodyType(RAPIER.RigidBodyType.Dynamic, true);
        petrified[i] = false;
      }
      sleepSince[i] = 0;
      matrixClean[i] = false;
    }
    petrifiedCount = 0;
    staticMaxR2 = 1;
    staticMaxY = 0;
    world.gravity.y = 18;
    for (const b of bodies) {
      const m = b.mass();
      b.applyImpulse({
        x: (Math.random() - 0.5) * 6 * m,
        y: (16 + Math.random() * 14) * m,
        z: (Math.random() - 0.5) * 6 * m,
      }, true);
      b.applyTorqueImpulse({
        x: (Math.random() - 0.5) * 0.4 * m,
        y: (Math.random() - 0.5) * 0.4 * m,
        z: (Math.random() - 0.5) * 0.4 * m,
      }, true);
    }
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- メインループ ----------
let rocketVel = 0;
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
const PHYS_DT = 1 / 60;
let physAccum = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // --- 進行管理 ---
  if (state.rocketing) {
    state.rocketTimer += dt;
    if (frozen) {
      // 固定済みの山は丸ごと打ち上げる
      const r = currentRadius();
      rocketVel += dt * 60 * Math.max(1, r / 6);
      pile.position.y += rocketVel * dt;
      pile.rotation.y += dt * 2;
      if (pile.position.y > Math.max(400, r * 40)) finishRocket();
    } else if (state.rocketTimer > 5) {
      finishRocket();
    }
  } else if (state.running) {
    state.timer += dt;
    if (state.timer >= state.interval) {
      state.timer -= state.interval;
      doubleNow();
    }
  }
  $('progress').style.width = `${Math.min(100, state.timer / state.interval * 100)}%`;

  // --- 物理ステップ（固定タイムステップ・最大3サブステップ） ---
  if (!frozen) {
    physAccum = Math.min(physAccum + dt, PHYS_DT * 3);
    while (physAccum >= PHYS_DT) {
      world.step();
      physAccum -= PHYS_DT;
    }
  }

  // --- 物理ボディ → 描画行列の同期（山の半径も同時に計測） ---
  // 静止している剛体はスキップ。さらに PETRIFY_MS 以上静止したら固定ボディ化して
  // ソルバーからも外す（山の内部・下層は二度と動かないため）
  const now = performance.now();
  let maxR2 = staticMaxR2, maxY = staticMaxY;
  let anyWritten = false;
  for (let i = 0; i < bodies.length; i++) {
    const isStatic = petrified[i] || bodies[i].isSleeping();
    if (!frozen && !petrified[i]) {
      // スリープ済み、またはほぼ静止（|v|<0.1）が PETRIFY_MS 続いたら石化
      let quiet = isStatic;
      if (!quiet) {
        const lv = bodies[i].linvel();
        quiet = lv.x * lv.x + lv.y * lv.y + lv.z * lv.z < 0.01;
      }
      if (quiet) {
        if (!sleepSince[i]) sleepSince[i] = now;
        else if (now - sleepSince[i] > PETRIFY_MS) {
          bodies[i].setBodyType(RAPIER.RigidBodyType.Fixed, false);
          petrified[i] = true;
          petrifiedCount++;
        }
      } else {
        sleepSince[i] = 0;
      }
    }
    if (matrixClean[i] && isStatic) continue;
    const p = bodies[i].translation();
    const q = bodies[i].rotation();
    dummy.position.set(p.x, p.y, p.z);
    dummy.quaternion.set(q.x, q.y, q.z, q.w);
    const t = Math.min(1, (now - spawnTimes[i]) / 280);
    const s = t < 0.75 ? 0.2 + (t / 0.75) * 0.95 : 1.15 - (t - 0.75) / 0.25 * 0.15; // ぽよん
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    manjuMesh.setMatrixAt(i, dummy.matrix);
    anyWritten = true;
    const r2 = p.x * p.x + p.z * p.z + p.y * p.y * 0.5;
    if (r2 > maxR2) maxR2 = r2;
    if (p.y > maxY) maxY = p.y;
    if (isStatic && t >= 1) {
      matrixClean[i] = true; // 静止確定 → 以降は書き直さず、範囲もキャッシュに畳み込む
      if (r2 > staticMaxR2) staticMaxR2 = r2;
      if (p.y > staticMaxY) staticMaxY = p.y;
    } else {
      matrixClean[i] = false;
    }
  }
  if (anyWritten) manjuMesh.instanceMatrix.needsUpdate = true;
  basePileRadius = Math.sqrt(maxR2) + MANJU_RADIUS;

  // --- 宇宙モード：天体サイズに達したら惑星→恒星→ブラックホールと姿が変わる ---
  let spaceRadius = 0;
  if (frozen && !state.rocketing) {
    const volNow = bigToNumber(state.count) * MANJU_VOLUME_M3;
    if (!space.active && volNow >= SPACE_VOL) enterSpace();
    if (space.active) {
      spaceRadius = updateSpace(volNow, bigToNumber(state.count) * MANJU_MASS_KG);
    }
  }

  // --- 上限超過後は「山ごと」体積比で拡大する（描画破綻を避けるため1e7倍まで） ---
  const targetScale = frozen && !state.rocketing && !space.active
    ? Math.cbrt(bigToNumber(state.count) / MAX_PHYS)
    : pile.scale.x;
  if (Number.isFinite(targetScale)) {
    const capped = Math.min(Math.max(1, targetScale), 1e7);
    pile.scale.setScalar(THREE.MathUtils.lerp(pile.scale.x, capped, 1 - Math.pow(0.02, dt)));
  }

  // --- カメラを山（または天体）の大きさに合わせてスムーズに引く ---
  const radius = space.active ? Math.max(8, spaceRadius) : currentRadius();
  contactShadow.scale.setScalar(Math.max(1, radius * 1.1));
  contactShadow.position.y = Math.max(0.01, radius * 0.005); // 遠景でのZファイティング防止
  ground.scale.setScalar(Math.max(1, radius * 6 / 2000));
  const targetDist = Math.max(9, radius * 3.1);
  camera.far = Math.max(5000, targetDist * 20);
  camera.updateProjectionMatrix();
  const curDist = camera.position.distanceTo(controls.target);
  const newDist = THREE.MathUtils.lerp(curDist, targetDist, 1 - Math.pow(0.1, dt));
  camera.position.sub(controls.target).setLength(newDist).add(controls.target);
  const targetY = space.active ? 0
    : state.rocketing && !frozen
      ? maxY * 0.6                                      // 打ち上げ中は群れを追う
      : radius * 0.3 + (frozen ? pile.position.y * 0.5 : 0);
  controls.target.lerp(new THREE.Vector3(0, targetY, 0), 1 - Math.pow(0.1, dt));
  scene.fog.density = space.active ? 1e-6 : 0.012 / Math.max(1, radius / 8);

  controls.update();
  renderer.render(scene, camera);

  // --- パフォーマンス表示（0.5秒ごと） ---
  fpsFrames++;
  if (now - fpsLast > 500) {
    const fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
    const active = bodies.length - petrifiedCount;
    $('perf').textContent = `${bodies.length.toLocaleString()}個（可動 ${active.toLocaleString()}） / ${fps} FPS`;
    fpsFrames = 0;
    fpsLast = now;
  }
}
let fpsFrames = 0, fpsLast = performance.now();

let basePileRadius = 1;
function currentRadius() {
  return Math.max(2, basePileRadius) * pile.scale.x;
}

function finishRocket() {
  rocketVel = 0;
  resetSim('ひと安心。…でも宇宙のどこかで増え続けています');
  state.running = true;
  $('playBtn').textContent = '⏸ 一時停止';
}

resetSim();
updateHUD();
animate();
</script>
</body>
</html>
