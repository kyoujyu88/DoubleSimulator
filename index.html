<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイバイン シミュレーター</title>
<style>
  :root {
    --panel-bg: rgba(20, 16, 12, 0.78);
    --accent: #ffb347;
    --danger: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1410; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; color: #f5ead8; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel {
    position: fixed; backdrop-filter: blur(8px);
    background: var(--panel-bg); border: 1px solid rgba(255, 179, 71, 0.25);
    border-radius: 14px; padding: 14px 18px;
  }
  #hud {
    top: 16px; left: 16px; min-width: 290px; max-width: 92vw;
  }
  #hud h1 { font-size: 17px; letter-spacing: 2px; color: var(--accent); margin-bottom: 8px; }
  #hud h1 small { font-size: 11px; color: #cbb89a; letter-spacing: 0; margin-left: 6px; }
  #count {
    font-size: 30px; font-weight: 700; line-height: 1.2; color: #fff;
    word-break: break-all; text-shadow: 0 0 16px rgba(255, 179, 71, .45);
  }
  #count .unit { font-size: 18px; color: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; margin-top: 6px; color: #e8d9bd; }
  .row b { color: #fff; font-weight: 600; text-align: right; }
  #compare { margin-top: 8px; font-size: 13px; color: var(--accent); min-height: 1.4em; }
  #progressWrap { margin-top: 10px; height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  #progress { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb347, #ff6b6b); transition: width .1s linear; }
  #nextLabel { font-size: 11px; color: #b8a888; margin-top: 4px; }

  #controls {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(255, 179, 71, .4); border-radius: 10px;
    background: rgba(255, 179, 71, .15); color: #ffe2b8; padding: 9px 16px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 179, 71, .3); }
  button:active { transform: scale(.96); }
  button.danger { border-color: rgba(255, 107, 107, .5); background: rgba(255, 107, 107, .15); color: #ffc9c9; }
  button.danger:hover { background: rgba(255, 107, 107, .3); }
  #controls label { font-size: 12px; color: #cbb89a; display: flex; align-items: center; gap: 6px; }
  input[type="range"] { accent-color: var(--accent); width: 110px; }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
    z-index: 10;
  }
  .toastMsg {
    background: rgba(20, 16, 12, .85); border: 1px solid rgba(255, 179, 71, .4);
    color: #ffe2b8; font-size: 14px; padding: 8px 18px; border-radius: 20px;
    animation: toastIn .4s ease, toastOut .6s ease 3.4s forwards;
    white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-12px); } }

  #footer {
    position: fixed; bottom: 8px; right: 12px; font-size: 10.5px; color: rgba(255,255,255,.35);
  }
  @media (max-width: 600px) {
    #hud { min-width: 0; right: 16px; }
    #count { font-size: 22px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="hud" class="panel">
  <h1>🌰 バイバイン<small>5分ごとに2倍にふえる</small></h1>
  <div id="count">1 <span class="unit">個</span></div>
  <div class="row"><span>倍増回数</span><b id="gen">0 回</b></div>
  <div class="row"><span>作中経過時間（5分/回）</span><b id="storyTime">0 分</b></div>
  <div class="row"><span>総体積</span><b id="volume">80 cm³</b></div>
  <div class="row"><span>総質量</span><b id="mass">50 g</b></div>
  <div id="compare"></div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div id="nextLabel">次の倍増まで…</div>
</div>

<div id="controls" class="panel">
  <button id="playBtn">⏸ 一時停止</button>
  <label>倍増間隔 <input type="range" id="speed" min="0.5" max="10" step="0.5" value="4"><span id="speedVal">4秒</span></label>
  <button id="resetBtn">↺ リセット</button>
  <button id="rocketBtn" class="danger">🚀 宇宙へ捨てる</button>
</div>

<div id="toast"></div>
<div id="footer">ドラッグで回転 / ホイールでズーム</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 定数 ----------
const MANJU_RADIUS = 0.5;          // 表示上のまんじゅう半径
const MANJU_VOLUME_M3 = 80e-6;     // 栗まんじゅう1個 ≈ 80 cm³
const MANJU_MASS_KG = 0.05;        // 1個 ≈ 50 g
const MAX_VISIBLE = 8192;          // 個別描画する上限（以降は山ごと拡大）

// 体積の比較対象（m³, 小さい順）
const COMPARISONS = [
  [3e-4,     'お茶碗'],
  [8e-3,     'バケツ'],
  [0.2,      'お風呂'],
  [40,       'ワンルームの部屋'],
  [180,      '学校の教室'],
  [540,      '25mプール'],
  [1.24e6,   '東京ドーム'],
  [4e11,     '富士山'],
  [1.4e18,   '月'],
  [1.08e21,  '地球'],
  [1.41e27,  '太陽'],
];

// 個数到達マイルストーン → メッセージ（体積換算でだいたい合わせてある）
const MILESTONES = [
  [4n,        'まだ余裕。おいしくいただけます 😋'],
  [64n,       'そろそろ食べきれない量です…'],
  [1n << 12n, 'お風呂いっぱいのまんじゅう！'],
  [1n << 19n, '部屋がまんじゅうで埋まりました！'],
  [1n << 24n, '学校の体育館も満杯になりました…'],
  [1n << 34n, '東京ドームが満杯になりました'],
  [1n << 53n, '富士山サイズのまんじゅう山が出現'],
  [1n << 84n, '⚠️ 地球がまんじゅうで埋め尽くされました！'],
  [1n << 104n, '太陽よりも大きい…。もうロケットで捨てるしかない！🚀'],
];

// 漢数字の大数単位（4桁ごと）
const KANJI_UNITS = ['', '万', '億', '兆', '京', '垓', '𥝱', '穣', '溝', '澗',
                     '正', '載', '極', '恒河沙', '阿僧祇', '那由他', '不可思議', '無量大数'];

// ---------- シーン ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);
scene.fog = new THREE.FogExp2(0x1a1410, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(7, 5, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xfff2dd, 0x42301f, 0.9));
const sun = new THREE.DirectionalLight(0xffe0b0, 1.6);
sun.position.set(6, 12, 4);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8899ff, 0.5);
rim.position.set(-8, 4, -6);
scene.add(rim);

// 星空（宇宙感の演出・遠景）
{
  const starGeo = new THREE.BufferGeometry();
  const N = 1500, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(1800 + Math.random() * 1200);
    pos.set([v.x, Math.abs(v.y), v.z], i * 3);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff5e0, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.7 })));
}

// 地面
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(2000, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 1 })
);
scene.add(ground);

// 接地影（山の下の薄い影）
const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1, 48).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false })
);
contactShadow.position.y = 0.01;
scene.add(contactShadow);

// ---------- 栗まんじゅうジオメトリ（上が焼き色・下が生地色の頂点カラー） ----------
function buildManjuGeometry() {
  const geo = new THREE.SphereGeometry(MANJU_RADIUS, 24, 18);
  geo.scale(1, 0.62, 1);
  const posAttr = geo.attributes.position;
  const colors = new Float32Array(posAttr.count * 3);
  const top = new THREE.Color(0x9c5a1e);    // 焼き色（栗色）
  const bottom = new THREE.Color(0xf3dCa8); // 生地色
  const c = new THREE.Color();
  for (let i = 0; i < posAttr.count; i++) {
    const t = THREE.MathUtils.clamp(posAttr.getY(i) / (MANJU_RADIUS * 0.62) * 0.5 + 0.5, 0, 1);
    c.lerpColors(bottom, top, Math.pow(t, 1.6));
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}

const manjuMesh = new THREE.InstancedMesh(
  buildManjuGeometry(),
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.65, metalness: 0.02 }),
  MAX_VISIBLE
);
manjuMesh.count = 0;
manjuMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

const pile = new THREE.Group();
pile.add(manjuMesh);
scene.add(pile);

// ---------- 山の配置（k番目の位置は不変：決定論的に山型へ詰めていく） ----------
function hash(k, seed) {
  let h = Math.imul(k + 1, 2654435761) ^ Math.imul(seed, 40503);
  h = Math.imul(h ^ (h >>> 13), 2246822519);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const SPACING = MANJU_RADIUS * 1.85;
const positions = []; // Vector3 のキャッシュ
function pilePosition(k) {
  if (positions[k]) return positions[k];
  if (k === 0) {
    return positions[0] = new THREE.Vector3(0, MANJU_RADIUS * 0.62, 0);
  }
  // 内側から外殻へ：球殻半径 ∝ k^(1/3)。方向は半球上＋上下に潰してドーム型に
  const u = hash(k, 1), v = hash(k, 2), w = hash(k, 3);
  const rr = Math.cbrt(k + w) * SPACING * 0.8;
  const theta = u * Math.PI * 2;
  const y01 = Math.pow(v, 1.7);                 // 下寄りに密集
  const horiz = Math.sqrt(Math.max(0, 1 - y01 * y01));
  const p = new THREE.Vector3(
    Math.cos(theta) * horiz * rr,
    Math.max(MANJU_RADIUS * 0.62, y01 * rr * 0.55 + MANJU_RADIUS * 0.4),
    Math.sin(theta) * horiz * rr
  );
  return positions[k] = p;
}
function pileRadiusFor(visible) {
  return Math.max(1, Math.cbrt(visible) * SPACING * 0.8 + MANJU_RADIUS);
}

// ---------- 状態 ----------
const state = {
  count: 1n,            // 現在の個数（正確に保持）
  gen: 0,               // 倍増回数
  running: true,
  interval: 4,          // 倍増間隔（秒）
  timer: 0,
  milestoneIdx: 0,
  rocketing: false,
};
const spawnAnims = []; // { index, t } 出現アニメーション

function visibleTarget() {
  return state.count > BigInt(MAX_VISIBLE) ? MAX_VISIBLE : Number(state.count);
}

const dummy = new THREE.Object3D();
function setInstance(i, scale) {
  const p = pilePosition(i);
  dummy.position.copy(p);
  const r1 = hash(i, 7), r2 = hash(i, 8);
  dummy.rotation.set((r1 - 0.5) * 0.5, r2 * Math.PI * 2, (hash(i, 9) - 0.5) * 0.5);
  dummy.scale.setScalar(scale);
  dummy.updateMatrix();
  manjuMesh.setMatrixAt(i, dummy.matrix);
}

function doubleNow() {
  const before = visibleTarget();
  state.count *= 2n;
  state.gen += 1;
  const after = visibleTarget();
  for (let i = before; i < after; i++) {
    setInstance(i, 0.001);
    spawnAnims.push({ index: i, t: -Math.min(0.4, (i - before) / Math.max(1, after - before) * 0.4) });
  }
  manjuMesh.count = after;
  manjuMesh.instanceMatrix.needsUpdate = true;
  checkMilestones();
  updateHUD();
}

function resetSim(toast) {
  state.count = 1n;
  state.gen = 0;
  state.timer = 0;
  state.milestoneIdx = 0;
  spawnAnims.length = 0;
  manjuMesh.count = 1;
  setInstance(0, 1);
  manjuMesh.instanceMatrix.needsUpdate = true;
  pile.scale.setScalar(1);
  pile.position.y = 0;
  pile.visible = true;
  state.rocketing = false;
  if (toast) showToast(toast);
  updateHUD();
}

// ---------- 表示まわり ----------
const $ = id => document.getElementById(id);

function formatCountKanji(n) { // BigInt → 「1234万5678」のような表記
  const s = n.toString();
  if (s.length > KANJI_UNITS.length * 4) { // 無量大数(10^68)超は指数表記
    return `${s[0]}.${s.slice(1, 3)}×10<span style="font-size:.6em;vertical-align:super">${s.length - 1}</span>`;
  }
  let out = '', rest = s;
  let unit = 0;
  const groups = [];
  while (rest.length > 0) {
    groups.unshift([rest.slice(-4), KANJI_UNITS[unit++]]);
    rest = rest.slice(0, -4);
  }
  const shown = groups.slice(0, 3); // 上位3単位だけ表示して読みやすく
  for (const [digits, u] of shown) {
    const d = String(Number(digits));
    if (d !== '0') out += d + (u ? `<span class="unit">${u}</span>` : '');
  }
  return out || '0';
}

const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c => SUP[+c] ?? c).join('');
const trimNum = x => Number(x.toPrecision(3)).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
function formatSI(x, unit) {
  if (!Number.isFinite(x)) return `∞ ${unit}`;
  if (x >= 1e16) {
    const e = Math.floor(Math.log10(x));
    return `${(x / 10 ** e).toFixed(2)}×10${sup(e)} ${unit}`;
  }
  const units = [[1e12, '兆'], [1e8, '億'], [1e4, '万']];
  for (const [v, label] of units) {
    if (x >= v) return `${trimNum(x / v)}${label} ${unit}`;
  }
  return `${trimNum(x)} ${unit}`;
}

function bigToNumber(n) { // 桁あふれしない近似変換
  const s = n.toString();
  return s.length > 15 ? Number(s.slice(0, 15)) * Math.pow(10, s.length - 15) : Number(s);
}

function formatStoryTime(gen) {
  const min = gen * 5;
  if (min < 60) return `${min} 分`;
  if (min < 1440) return `${Math.floor(min / 60)} 時間 ${min % 60} 分`;
  return `${Math.floor(min / 1440)} 日 ${Math.floor((min % 1440) / 60)} 時間`;
}

function updateHUD() {
  const countNum = bigToNumber(state.count);
  $('count').innerHTML = `${formatCountKanji(state.count)} <span class="unit">個</span>`;
  $('gen').textContent = `${state.gen} 回`;
  $('storyTime').textContent = formatStoryTime(state.gen);

  const vol = countNum * MANJU_VOLUME_M3;
  const mass = countNum * MANJU_MASS_KG;
  $('volume').textContent = vol < 1
    ? `${(vol * 1e6).toLocaleString('ja-JP', { maximumFractionDigits: 0 })} cm³`
    : `${formatSI(vol, 'm³')}`;
  $('mass').textContent = mass < 1 ? `${trimNum(mass * 1000)} g`
    : mass < 1000 ? `${trimNum(mass)} kg`
    : formatSI(mass / 1000, 't');

  // 比較表示：超えている最大の対象
  let cmp = '';
  for (const [v, name] of COMPARISONS) {
    if (vol >= v) cmp = `${name} 約${formatSI(vol / v, '')}個分の体積！`;
  }
  $('compare').textContent = cmp;
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toastMsg';
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function checkMilestones() {
  while (state.milestoneIdx < MILESTONES.length && state.count >= MILESTONES[state.milestoneIdx][0]) {
    showToast(MILESTONES[state.milestoneIdx][1]);
    state.milestoneIdx++;
  }
}

// ---------- UI イベント ----------
$('playBtn').addEventListener('click', () => {
  state.running = !state.running;
  $('playBtn').textContent = state.running ? '⏸ 一時停止' : '▶ 再開';
});
$('speed').addEventListener('input', e => {
  state.interval = Number(e.target.value);
  $('speedVal').textContent = `${state.interval}秒`;
});
$('resetBtn').addEventListener('click', () => resetSim('リセットしました'));
$('rocketBtn').addEventListener('click', () => {
  if (state.rocketing) return;
  state.rocketing = true;
  state.running = false;
  $('playBtn').textContent = '▶ 再開';
  showToast('🚀 まんじゅうの山を宇宙へ……');
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- メインループ ----------
let rocketVel = 0;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (state.rocketing) {
    // 山ごと宇宙へ打ち上げ → 見えなくなったらリセット
    const r = pileRadiusFor(visibleTarget()) * pile.scale.x;
    rocketVel += dt * 60 * Math.max(1, r / 6);
    pile.position.y += rocketVel * dt;
    pile.rotation.y += dt * 2;
    if (pile.position.y > Math.max(400, r * 40)) {
      rocketVel = 0;
      pile.rotation.y = 0;
      resetSim('ひと安心。…でも宇宙のどこかで増え続けています');
      state.running = true;
      $('playBtn').textContent = '⏸ 一時停止';
    }
  } else if (state.running) {
    state.timer += dt;
    if (state.timer >= state.interval) {
      state.timer -= state.interval;
      doubleNow();
    }
  }
  $('progress').style.width = `${Math.min(100, state.timer / state.interval * 100)}%`;

  // 出現アニメーション（ぽよんと膨らむ）
  for (let i = spawnAnims.length - 1; i >= 0; i--) {
    const a = spawnAnims[i];
    a.t += dt * 2.2;
    if (a.t < 0) continue;
    const t = Math.min(a.t, 1);
    const s = t < 0.7 ? (t / 0.7) * 1.18 : 1.18 - (t - 0.7) / 0.3 * 0.18; // overshoot
    setInstance(a.index, Math.max(0.001, s));
    if (t >= 1) spawnAnims.splice(i, 1);
  }
  if (spawnAnims.length) manjuMesh.instanceMatrix.needsUpdate = true;

  // 上限超過後は「山ごと」体積比で拡大する（描画破綻を避けるため拡大は1e7倍まで）
  const targetScale = state.count > BigInt(MAX_VISIBLE)
    ? Math.cbrt(bigToNumber(state.count) / MAX_VISIBLE)
    : 1;
  if (Number.isFinite(targetScale)) {
    const capped = Math.min(targetScale, 1e7);
    pile.scale.setScalar(THREE.MathUtils.lerp(pile.scale.x, capped, 1 - Math.pow(0.02, dt)));
  }

  // カメラを山の大きさに合わせてスムーズに引く
  const radius = pileRadiusFor(visibleTarget()) * pile.scale.x;
  contactShadow.scale.setScalar(radius * 1.15);
  ground.scale.setScalar(Math.max(1, radius * 6 / 2000));
  const targetDist = Math.max(9, radius * 3.1);
  camera.far = Math.max(5000, targetDist * 20);
  camera.updateProjectionMatrix();
  const curDist = camera.position.distanceTo(controls.target);
  const newDist = THREE.MathUtils.lerp(curDist, targetDist, 1 - Math.pow(0.1, dt));
  camera.position.sub(controls.target).setLength(newDist).add(controls.target);
  controls.target.lerp(new THREE.Vector3(0, radius * 0.35 + pile.position.y * 0.5, 0), 1 - Math.pow(0.1, dt));
  scene.fog.density = 0.012 / Math.max(1, radius / 8);

  controls.update();
  renderer.render(scene, camera);
}

resetSim();
animate();
</script>
</body>
</html>
